version: '3'
services:
  app:
    env_file: ".env"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      #- node_modules:/app/node_modules
      - ${STORAGE_PATH:-storage}:/app/storage
      - ${LOGS_PATH:-logs}:/app/logs
      - ${PUBLIC_PATH:-public}:/app/public
    environment:
      - PORT=3000
      - RAILS_ENV=development
    ports:
      - 3000:3000
    command: bundle exec puma
    restart: on-failure
  pg:
    env_file: ".env"
    image: postgres
    volumes:
      - ${POSTGRES_PATH:-pg_data}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: decidim_guatemala_development
    restart: on-failure
volumes:
  node_modules: {}
  bundle: {}
  pg_data: {}
tty: true
stdin_open: true