name: decidim-guatemala
services:
  app:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ${STORAGE_PATH:-storage}:/app/storage
      - ${LOGS_PATH}:/app/log
      - /app/node_modules
    environment:
      - SHAKAPACKER_DEV_SERVER_WATCH_POLLING=true
      - RAILS_SERVE_STATIC_FILES=true
    ports:
      - ${RAILS_PORT}:3000
    tty: true
    stdin_open: true
  pg:
    env_file: .env
    image: postgres
    ports:
      - 5433:5432 # Map host port 5433 to container port 5432
    volumes:
      - ${POSTGRES_PATH:-pg_data}:/var/lib/postgresql/data
    restart: on-failure
    stdin_open: true
    tty: true
volumes:
  bundle: {}
  pg_data: {}