name: decidim-guatemala
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - RAILS_ENV=production
      - DB_WAIT=true
      - RAILS_PORT=3000
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - tmp_cache:/app/tmp
      - ${STORAGE_PATH:-storage}:/app/storage
    ports:
      - ${APP_PORT}:3000
    tty: true
    stdin_open: true
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://0.0.0.0:3000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
  delayed_job:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec rake jobs:work
    env_file: .env
    volumes:
      - tmp_cache:/app/tmp
      - ${STORAGE_PATH:-storage}:/app/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  pg:
    env_file: .env
    image: postgres:16-alpine
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_USER=${DATABASE_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - POSTGRES_DB=${DATABASE_NAME:-postgres}
    volumes:
      - ${POSTGRES_PATH:-pg_data}:/var/lib/postgresql/data
    restart: on-failure
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 2s
  redis:
    image: redis
    volumes:
      - redis_data:/data
volumes:
  tmp_cache: {}
  redis_data: {}